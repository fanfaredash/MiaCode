name: Build Release Package (Windows)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-windows:
    name: Windows Qt 6.8
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare FFmpeg
        shell: pwsh
        run: ./scripts/ensure-windows-ffmpeg.ps1

      - name: Run build script
        shell: pwsh
        run: ./scripts/build-win.ps1

      - name: Detect Artifact Name
        id: artifact_name
        shell: pwsh
        run: |
          $distDir = Get-ChildItem -Path dist -Directory -Filter 'MiaCode-v*-win64' | Select-Object -First 1
          if ($null -eq $distDir) {
            throw "Windows dist directory not found."
          }
          "name=$($distDir.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: dist/MiaCode-v*-win64
          if-no-files-found: error
