name: macOS package

# Run list title: nightly · <branch> · <push timestamp>.
run-name: nightly · ${{ github.ref_name }} · ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}

on:
  push:
    branches:
      - dev
      - feature/qml-ui
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: arm64
    runs-on: macos-14
    timeout-minutes: 90
    env:
      CMAKE_OSX_ARCHITECTURES: arm64
      CMAKE_OSX_DEPLOYMENT_TARGET: "13.0"
      MIACODE_PACKAGE_CHANNEL: nightly

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore Qt
        uses: actions/cache@v4
        with:
          path: .qt/6.11.1
          key: qt-6.11.1-macos-arm64

      - name: Restore media kit
        uses: actions/cache@v4
        with:
          path: third_party/ffmpeg/macos
          key: media-macos-arm64-${{ hashFiles('scripts/ffmpeg/**') }}

      - name: Build and package
        run: bash scripts/build/build-macos-ci.sh

      - name: Resolve artifact name
        id: package
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/*.7z)
          if [[ ${#packages[@]} -ne 1 || ! -f "${packages[0]}" ]]; then
            echo "Expected one macOS package archive under dist/, found: ${packages[*]}" >&2
            exit 1
          fi
          printf 'archive_name=%s\n' "$(basename "${packages[0]}")" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: dist/*.7z
          if-no-files-found: error
          retention-days: 14
