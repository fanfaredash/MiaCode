name: Windows package

# Run list title: nightly · <branch> · <push timestamp>.
run-name: nightly · ${{ github.ref_name }} · ${{ github.event.head_commit.timestamp || github.event.repository.pushed_at }}

on:
  push:
    branches:
      - dev
      - feature/qml-ui
      - ci/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: x64
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      # Release artifact marker: MiaCode_<version>_nightly_win_<arch>.
      MIACODE_PACKAGE_CHANNEL: nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          lfs: true
          submodules: recursive

      - name: Restore finished package
        id: package-cache
        uses: actions/cache/restore@v6
        with:
          path: dist
          key: package-windows-x64-v1-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'resources/**', 'assets/**', 'translations/**', 'templates/**', 'third_party/**', 'scripts/build/**', 'scripts/ffmpeg/**', 'LICENSE', 'LICENSE_SCOPE.md', 'THIRD_PARTY_NOTICES.md') }}

      - name: Restore Qt
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v6
        with:
          path: .qt/6.11.1/msvc2022_64
          key: qt-6.11.1-windows-x64

      - name: Restore media kit
        if: steps.package-cache.outputs.cache-hit != 'true'
        id: media-cache
        uses: actions/cache/restore@v6
        with:
          path: |
            third_party/ffmpeg/windows/win64/dev
            third_party/ffmpeg/windows/win64/ffmpeg.exe
          key: media-windows-x64-ffmpeg7.1-${{ hashFiles('scripts/ffmpeg/ensure-windows-ffmpeg.ps1', 'scripts/ffmpeg/trim/**') }}
          restore-keys: media-windows-x64-ffmpeg7.1-

      - name: Restore compiled objects
        if: steps.package-cache.outputs.cache-hit != 'true'
        id: build-cache
        uses: actions/cache/restore@v6
        with:
          path: build-msvc
          key: build-windows-x64-qt6.11.1-ffmpeg7.1-${{ hashFiles('CMakeLists.txt', 'cmake/**', 'src/**', 'resources/**', 'translations/**', 'third_party/**') }}
          restore-keys: build-windows-x64-qt6.11.1-ffmpeg7.1-

      - name: Build and package
        if: steps.package-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $jobs = [int]$env:NUMBER_OF_PROCESSORS
          ./scripts/build/build-win.ps1 -Toolchain msvc -BuildDir build-msvc -BuildJobs $jobs

      - name: Save media kit
        if: always() && steps.package-cache.outputs.cache-hit != 'true' && steps.media-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            third_party/ffmpeg/windows/win64/dev
            third_party/ffmpeg/windows/win64/ffmpeg.exe
          key: ${{ steps.media-cache.outputs.cache-primary-key }}

      - name: Save compiled objects
        if: always() && steps.package-cache.outputs.cache-hit != 'true' && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: build-msvc
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Verify package
        if: steps.package-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $distDirs = @(Get-ChildItem dist -Directory -Filter "MiaCode_*_win_x64")
          if ($distDirs.Count -ne 1) {
            throw "Expected one Windows x64 package directory, found: $($distDirs.Name -join ', ')"
          }
          ./scripts/build/verify-win-package.ps1 -DistDir $distDirs[0].FullName -Arch x64 -SkipLaunch

      - name: Resolve artifact name
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archives = @(Get-ChildItem dist -File -Filter "*.7z")
          if ($archives.Count -ne 1) {
            throw "Expected one Windows package archive under dist, found: $($archives.Name -join ', ')"
          }
          "archive_name=$($archives[0].Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Enforce x64 package size
        shell: pwsh
        run: |
          $archive = Get-Item "dist/${{ steps.package.outputs.archive_name }}"
          $sizeMb = [math]::Round($archive.Length / 1MB, 2)
          Write-Host "Windows x64 package: $sizeMb MB"
          if ($archive.Length -ge 80MB) {
            throw "Windows x64 package exceeds 80 MB: $sizeMb MB"
          }

      - name: Save finished package
        if: steps.package-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: dist
          key: ${{ steps.package-cache.outputs.cache-primary-key }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.archive_name }}
          path: dist/*.7z
          if-no-files-found: error
          retention-days: 14
