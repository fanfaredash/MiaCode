name: Build Portable Package (macOS)

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-macos:
    name: macOS Qt 6.1
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt 6.1.3 (clang_64)
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.1.3
          host: mac
          target: desktop
          arch: clang_64

      - name: Package Portable
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ env.Qt6_DIR }}
        run: |
          chmod +x scripts/package-mac.sh
          bash scripts/package-mac.sh

      - name: Upload Portable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MiaCode-portable-macos
          path: dist/*.zip
          if-no-files-found: error
