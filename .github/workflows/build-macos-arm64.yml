name: Build Release Package (macOS Apple Silicon)

on:
  push:
    branches:
      - dev
  workflow_dispatch:

jobs:
  build-macos-arm64:
    name: macOS Apple Silicon (arm64)
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          host: mac
          target: desktop
          modules: qtmultimedia
          cache: true

      - name: Package Release
        shell: bash
        env:
          CMAKE_OSX_ARCHITECTURES: arm64
          CMAKE_OSX_DEPLOYMENT_TARGET: 13.0
          MACOS_CODESIGN_IDENTITY: "-"
        run: |
          chmod +x scripts/package-mac.sh
          bash scripts/package-mac.sh

      - name: Verify App Signature
        shell: bash
        run: |
          APP_PATH="$(find dist -maxdepth 2 -type d -name 'MiaCode.app' | head -n 1)"
          test -n "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"

      - name: Detect Artifact Name
        id: artifact_name
        shell: bash
        run: |
          ZIP_PATH="$(find dist -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          test -n "$ZIP_PATH"
          echo "name=$(basename "$ZIP_PATH" .zip)" >> "$GITHUB_OUTPUT"

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.artifact_name.outputs.name }}
          path: dist/*.zip
          if-no-files-found: error
