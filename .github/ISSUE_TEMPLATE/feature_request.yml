name: Feature request
description: Suggest an improvement or new feature.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for sharing an idea. Please describe the workflow or problem first so the request has context.

  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow
      description: What are you trying to do, and what currently makes it hard?
      placeholder: "When making/editing/exporting..., I currently have to..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior you would like MiaCode to support.
      placeholder: "It would help if MiaCode could..."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Related area
      options:
        - Editor
        - Preview
        - Timeline
        - Audio
        - Video export
        - Cover export
        - Packaging
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Mention any workaround, existing tool, or different design you considered.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, references, or sample charts if they help explain the request.
